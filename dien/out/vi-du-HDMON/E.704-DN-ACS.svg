<text x="79.208" y="277.591" font-family="Arial, Helvetica, sans-serif" font-size="2.374" text-anchor="start" fill="rgb(232,86,42)">1. Mỗi cửa: đầu đọc (cáp 6 lõi có lưới), khóa điện (cáp 2 × 1,0), nút exit và công tắc cửa (cáp 2 lõi), nút khẩn mở cửa.</text>
<text x="79.208" y="281.591" font-family="Arial, Helvetica, sans-serif" font-size="2.374" text-anchor="start" fill="rgb(232,86,42)">2. Liên động báo cháy: tín hiệu từ tủ báo cháy mở khóa các cửa thoát nạn (điểm giao tiếp, hệ báo cháy ngoài phạm vi).</text>
<text x="79.208" y="285.591" font-family="Arial, Helvetica, sans-serif" font-size="2.374" text-anchor="start" fill="rgb(232,86,42)">3. Chuông cửa IP: nút gọi ngoài trời (PoE 6 W) và màn hình trong nhà (PoE 8 W) nối switch PoE bằng Cat6.</text>
